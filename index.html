<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 초간단 재미있는 32문항 MBTI 테스트</title>
    <!-- Tailwind CSS 및 FontAwesome 애니메이션 CDN 라이브러리 -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- 1. 시작 화면 섹션 -->
    <section id="start-section" class="min-h-screen flex flex-col justify-center items-center p-6 gradient-bg text-white text-center">
        <div class="animate__animated animate__fadeInDown">
            <span class="text-6xl mb-4 block">🔮</span>
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">나를 찾는 32문항 스피드 퀴즈</h1>
            <p class="text-lg text-indigo-100 mb-8 max-w-md mx-auto">고민은 절대 금지! 직관적으로 끌리는 답변을 선택하며 아래로 스크롤 해보세요.</p>
            <button onclick="startTest()" class="bg-white text-indigo-600 font-bold text-xl px-12 py-4 rounded-full shadow-lg hover:scale-105 transition-transform duration-200 cursor-pointer">
                시작하기 🚀
            </button>
        </div>
    </section>

    <!-- 2. 퀴즈 문항 섹션 -->
    <section id="quiz-section" class="hidden max-w-2xl mx-auto px-4 py-12">
        <!-- 상단 고정 진행 바 -->
        <div class="sticky top-4 bg-white/80 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-slate-100 mb-8 z-50 flex items-center justify-between">
            <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden mr-4">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="progress-text" class="font-bold text-sm text-indigo-600 whitespace-nowrap">0 / 32</span>
        </div>

        <!-- 질문 카드들이 동적으로 생성될 컨테이너 -->
        <div id="questions-container" class="space-y-6"></div>
    </section>

    <!-- 3. 결과 화면 섹션 -->
    <section id="result-section" class="hidden min-h-screen flex flex-col justify-center items-center p-6 bg-slate-900 text-white text-center animate__animated animate__fadeIn">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
            <span class="text-2xl text-indigo-400 font-bold tracking-wider block mb-2">당신의 성향 결과는?</span>
            <div id="result-emoji" class="text-8xl my-4 animate__animated animate__bounceIn"></div>
            <h2 id="result-mbti" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-indigo-400 mb-2"></h2>
            <p id="result-title" class="text-xl font-bold text-slate-300 mb-6"></p>
            
            <div class="bg-slate-700/50 p-4 rounded-xl text-left text-sm text-slate-300 space-y-2 mb-8" id="result-desc">
                <!-- 결과 설명 상세 노출 -->
            </div>

            <button onclick="restartTest()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg cursor-pointer">
                다시 테스트하기 🔄
            </button>
        </div>
    </section>

    <!-- 내부 로직 JavaScript -->
    <script>
        // 32개 문항 데이터 (E/I, N/S, T/F, J/P 각 8문항씩 밸런스 배치)
        const questions = [
            // E vs I (1~8)
            { type: "EI", q: "주말에 에너지를 충전하는 최고의 방법은?", a: "친구들과 밖에서 시끌벅적 놀기", b: "이불 속에서 혼자 넷플릭스 보기" },
            { type: "EI", q: "처음 보는 사람들과 대화할 때 나의 행동은?", a: "어색함을 깨기 위해 먼저 말을 건다", b: "상대방이 말 걸어줄 때까지 기다린다" },
            { type: "EI", q: "팀 프로젝트를 할 때 선호하는 소통 방식은?", a: "직접 만나서 회의하거나 전화하기", b: "메신저나 이메일로 텍스트 소통하기" },
            { type: "EI", q: "단골 가게 사장님이 과하게 친근하게 말을 걸면?", a: "기분 좋게 스몰토크를 이어 나간다", b: "내적 내향인이 발동해 다음엔 다른 곳을 찾는다" },
            { type: "EI", q: "스트레스를 심하게 받았을 때 생각나는 것은?", a: "친구들과 술 한잔하며 털어버리기", b: "조용한 방에서 혼자만의 시간 갖기" },
            { type: "EI", q: "내 방을 꾸밀 때 더 신경 쓰이는 부분은?", a: "지인들을 초대했을 때 보여지는 거실/공간", b: "오직 나만의 아늑한 침대 주변" },
            { type: "EI", q: "파티나 모임에서 나는 주로 어떤 역할?", a: "대화를 주도하고 분위기를 띄우는 텐션 마스터", b: "리액션을 잘해주며 조용히 자리를 지키는 관객" },
            { type: "EI", q: "갑작스러운 친구의 '지금 나올래?' 제안에?", a: "기다렸다는 듯 옷을 입고 나간다", b: "이미 씻고 누웠으므로 절대 불가능하다" },

            // NS vs S (9~16)
            { type: "NS", q: "새로 나온 음식을 먹을 때 나의 생각은?", a: "맛의 재료와 맛의 조화를 상상하고 분석한다", b: "그냥 맛있거나 맛없거나 직관적으로 판정한다" },
            { type: "NS", q: "비행기를 타고 먼 곳으로 여행을 갈 때?", a: "혹시 모를 추락 사고나 비상착륙 상황을 시뮬레이션한다", b: "가서 뭐 먹을지, 숙소는 어떨지 실용적인 생각을 한다" },
            { type: "NS", q: "친구가 '나 요즘 우주에 관심 생겼어' 라고 한다면?", a: "외계인의 존재나 지구 종말에 대해 토론을 시작한다", b: "우주 다큐멘터리 추천이나 관련 굿즈 이야기를 한다" },
            { type: "NS", q: "사과하면 가장 먼저 머릿속에 떠오르는 것은?", a: "스티브 잡스, 뉴턴, 독사과, 백설공주", b: "빨갛고 아삭하고 맛있는 과일 사과" },
            { type: "NS", q: "노래를 들을 때 내가 더 꽂히는 부분은?", a: "가사에 담긴 은유적인 의미와 분위기", b: "귀에 꽂히는 멜로디와 리듬" },
            { type: "NS", q: "아무 생각 없이 멍 때리라고 한다면?", a: "생각을 안 하려는 생각 때문에 온갖 상상이 꼬리를 문다", b: "진짜 머릿속을 하얗게 비우고 무념무상이 가능하다" },
            { type: "NS", q: "로또 1등에 당첨되는 상상을 할 때?", a: "건물을 사고 재단을 설립하는 구체적인 미래 계획까지 세운다", b: "일단 당첨되고 나서 생각하자며 금방 상상을 멈춘다" },
            { type: "NS", q: "사용 설명서를 읽을 때 나의 스타일은?", a: "대충 원리만 이해하면 설명서 없이 조립을 시작한다", b: "순서대로 1번부터 차근차근 정독하며 따라 한다" },

            // TF vs F (17~24)
            { type: "TF", q: "친구가 '나 우울해서 화분 샀어' 라고 말할 때 나의 반응은?", a: "무슨 화분 샀어? 키우기 쉬운 거야?", b: "왜 우울해? 무슨 일 있었어? ㅠㅠ" },
            { type: "TF", q: "친구가 내 과실로 가벼운 교통사고를 냈다고 전화가 오면?", a: "보험은 불렀어? 다친 데는 없고?", b: "헐 어떡해! 진짜 놀랐겠다! 괜찮아?" },
            { type: "TF", q: "연인이 '나 시험 떨어졌어...' 라고 울먹일 때?", a: "몇 점 차이로 떨어졌어? 다음 시험 언제야?", b: "그동안 진짜 고생 많았는데 속상하겠다..." },
            { type: "TF", q: "영화나 드라마를 볼 때 나의 감정 상태는?", a: "스토리의 개연성과 완성도를 따지며 본다", b: "등장인물에 과몰입해서 폭풍 눈물을 흘린다" },
            { type: "TF", q: "내가 생각하는 진정한 위로란?", a: "문제를 해결할 수 있는 실질적인 대안 제시하기", b: "내 마음에 공감해 주고 곁에 있어 주기" },
            { type: "TF", q: "상대방의 피드백을 받을 때 더 편하게 느껴지는 어조는?", a: "조금 차갑더라도 명확하고 팩트 위주인 피드백", b: "나를 배려해서 부드럽고 완곡하게 돌려 말하는 피드백" },
            { type: "TF", q: "논쟁이나 말싸움이 생겼을 때 나의 태도는?", a: "누가 옳고 그른지 시시비비를 명확히 가려야 한다", b: "이유 불문하고 관계가 서먹해지거나 싸우는 상황 자체가 싫다" },
            { type: "TF", q: "친구가 헤어 스타일을 바꿨는데 내 눈에 별로일 때?", a: "솔직하게 이전 머리가 더 나은 것 같다고 말해준다", b: "상처받을까 봐 잘 어울린다고 영혼 없이 칭찬한다" },

            // JP vs P (25~32)
            { type: "JP", q: "내일 친구들과 여행을 가기로 했다면 나의 상태는?", a: "시간 단위 일정표와 맛집 리스트가 완벽히 준비됨", b: "가서 꼴리는 대로 움직이기로 하고 짐만 대충 쌈" },
            { type: "JP", q: "과제를 하거나 업무를 처리할 때 나의 방식은?", a: "마감일보다 훨씬 먼저 계획을 세워 미리 끝낸다", b: "벼락치기의 스릴을 즐기며 마감 직전에 초인적인 힘을 낸다" },
            { type: "JP", q: "갑자기 약속이 취소되었을 때 나의 속마음은?", a: "내 계획이 틀어져서 살짝 스트레스 받거나 무얼 할지 방황한다", b: "오히려 좋아! 집에서 뒹굴거릴 생각에 행복하다" },
            { type: "JP", q: "내 책상 위나 방 안의 정리 상태는?", a: "물건들이 제자리에 완벽하게 정돈되어 있어야 마음이 편함", b: "필요한 게 어디 있는지 대충 내가 알 정도면 어질러져 있어도 무관" },
            { type: "JP", q: "카카오톡 지도에 저장된 맛집 리스트를 보면?", a: "지역별, 업종별로 깔끔하게 폴더 핑이 되어있다", b: "가고 싶은 곳들이 뒤죽박죽으로 무작위 저장되어 있다" },
            { type: "JP", q: "넷플릭스에서 볼 영상을 고를 때 나의 행동은?", a: "미리 찜해둔 검증된 리스트 중에서 순서대로 고른다", b: "이것저것 탐색 레이더를 돌리다가 고르는 데만 30분 걸린다" },
            { type: "JP", q: "약속 장소에 나갈 때 나의 시간 계산법은?", a: "이동 시간, 도보 시간, 변수까지 고려해 10분 전 도착 타겟팅", b: "출발할 때 시계를 보고 대충 아슬아슬하게 도착하거나 약간 늦음" },
            { type: "JP", q: "새해 목표나 버킷리스트를 작성할 때?", a: "달성 기간과 세부 행동 수칙까지 적어둔다", b: "큼직하고 낭만적인 목표만 적어두고 일단 다짐에 만족한다" }
        ];

        // MBTI 결과 매핑 데이터 (이모지 및 요약 설명)
        const mbtiResults = {
            ISTJ: { emoji: "🗿", title: "청렴결백한 논리주의자", desc: ["규칙과 약속을 철저히 지켜요.", "현실적이고 신중하며 책임감이 강합니다.", "가끔은 융통성이 부족하다는 소리를 들어요."] },
            ISFJ: { emoji: "😇", title: "용감한 수호자", desc: ["주변 사람들을 헌신적으로 챙겨요.", "타인의 감정에 민감하고 기억력이 좋습니다.", "거절을 잘 못 해서 혼자 속앓이를 해요."] },
            INFJ: { emoji: "🔮", title: "선의의 옹호자", desc: ["가장 흔치 않은 유형으로 통찰력이 뛰어나요.", "이상주의적이며 내면의 신념이 깊습니다.", "생각이 너무 많아 스스로 피곤할 때가 많아요."] },
            INTJ: { emoji: "🎓", title: "용의주도한 전략가", desc: ["철저한 계산과 전략을 좋아하는 분석가입니다.", "독립심이 강하고 효율성을 극도로 추구해요.", "사람 관계에서도 논리를 따지려 합니다."] },
            ISTP: { emoji: "🛠️", title: "만능 재주꾼", desc: ["과묵하지만 상황 적응력이 뛰어난 만능 도구인.", "효율성을 중시하며 만사가 귀찮을 때가 많아요.", "틀에 박힌 규칙을 싫어합니다."] },
            ISFP: { emoji: "🎨", title: "호기심 많은 예술가", desc: ["말없이 다정하고 온화한 평화주의자입니다.", "미적 감각이 좋고 현재의 행복을 즐겨요.", "추진력이 약해 미루기의 끝판왕입니다."] },
            INFP: { emoji: "🦄", title: "열정적인 중재자", desc: ["낭만적이고 감수성이 풍부한 따뜻한 영혼.", "이해심이 많고 자신만의 가치관이 뚜렷해요.", "마음이 여려 쉽게 상처를 받기도 합니다."] },
            INTP: { emoji: "🧪", title: "논리적인 사색가", desc: ["호기심이 많은 아이디어를 품은 뱅크.", "분석적이고 지적이며 비평적인 관점을 가집니다.", "감정 표현에 서툴러 차갑다는 소리를 들어요."] },
            ESTP: { emoji: "🏍️", title: "수완 좋은 활동가", desc: ["오늘을 즐기는 짜릿한 에너자이저.", "행동력이 넘치고 주변 사람들을 즐겁게 해요.", "깊은 생각보다는 몸이 먼저 반응합니다."] },
            ESFP: { emoji: "🎉", title: "자유로운 영혼의 연예인", desc: ["인생이 즐거운 축제 같은 흥부자 유형.", "친화력이 뛰어나고 분위기 메이커 역할을 해요.", "충동적인 소비나 결정을 조심해야 합니다."] },
            ENFP: { emoji: "🎈", title: "재기발랄한 활동가", desc: ["정이 많고 긍정 에너지가 뿜어져 나오는 사람.", "상상력이 풍부하고 매일 새로운 아이디어가 샘솟아요.", "반복되는 일상이나 구속을 견디지 못합니다."] },
            ENTP: { emoji: "💡", title: "뜨거운 논쟁을 즐기는 변론가", desc: ["두뇌 회전이 빠르고 말싸움에 지지 않는 독설가 지망생.", "도전정신이 강하고 고정관념을 깨부숩니다.", "뒷마무리가 조금 약한 편입니다."] },
