<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 정식 MBTI 성격 진단 및 전문 해설 프로그램</title>
    <!-- Tailwind CSS 및 애니메이션 라이브러리 -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Pretendard', sans-serif; scroll-behavior: smooth; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <!-- 1. 시작 화면 -->
    <section id="start-section" class="min-h-screen flex flex-col justify-center items-center p-6 gradient-bg text-white text-center">
        <div class="animate__animated animate__fadeIn max-w-xl">
            <span class="text-7xl mb-6 block animate__bounce">📋</span>
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight leading-tight">정식 MBTI 성격 유형<br>정밀 분석 프로그램</h1>
            <p class="text-base md:text-lg text-blue-100 mb-8 font-light">
                본 진단은 32개의 표준화된 지표 문항을 통해 개인의 심리 선호 경향을 조사합니다. <br>
                결과 페이지에서 성격 특징, 장단점, 행동 보완점 등 전문 해설 리포트를 제공합니다.
            </p>
            <button onclick="startTest()" class="bg-white text-blue-700 font-bold text-lg md:text-xl px-12 py-4 rounded-xl shadow-2xl hover:bg-blue-50 hover:scale-102 transition-all cursor-pointer">
                진단 시작하기 🚀
            </button>
        </div>
    </section>

    <!-- 2. 퀴즈 문항 화면 -->
    <section id="quiz-section" class="hidden max-w-2xl mx-auto px-4 py-12">
        <!-- 상단 진행바 고정 -->
        <div class="sticky top-4 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-md border border-slate-200/60 mb-8 z-50 flex items-center justify-between">
            <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden mr-4">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="progress-text" class="font-bold text-sm text-blue-600 whitespace-nowrap">0 / 32</span>
        </div>

        <!-- 문항 컨테이너 -->
        <div id="questions-container" class="space-y-6"></div>
    </section>

    <!-- 3. 확장형 결과 리포트 화면 -->
    <section id="result-section" class="hidden min-h-screen bg-slate-100 py-12 px-4 animate__animated animate__fadeIn">
        <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
            
            <!-- 상단 헤더 요약 (그라데이션) -->
            <div class="p-8 text-center bg-gradient-to-br from-slate-900 to-indigo-950 text-white relative">
                <div id="result-emoji" class="text-7xl mb-4 animate__animated animate__zoomIn"></div>
                <p class="text-blue-400 font-bold tracking-widest text-sm uppercase mb-1">PRO 심리분석 결과 리포트</p>
                <h2 id="result-mbti" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300 mb-2"></h2>
                <p id="result-title" class="text-xl md:text-2xl font-bold text-slate-200"></p>
            </div>

            <!-- 메인 해설 상세 영역 -->
            <div class="p-6 md:p-10 space-y-10">
                
                <!-- 1) 종합 성격 특징 -->
                <div>
                    <h3 class="text-xl font-bold text-slate-900 border-l-4 border-blue-600 pl-3 mb-4">💡 종합 성격 특징 해설</h3>
                    <div id="result-features" class="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-slate-700 leading-relaxed space-y-3">
                        <!-- 동적 주입 -->
                    </div>
                </div>

                <!-- 2) 장점 및 강점 분석 -->
                <div>
                    <h3 class="text-xl font-bold text-slate-900 border-l-4 border-emerald-500 pl-3 mb-4">✨ 핵심 장점 및 강점 (Strength)</h3>
                    <div id="result-strengths" class="grid grid-cols-1 gap-3">
                        <!-- 동적 주입 -->
                    </div>
                </div>

                <!-- 3) 단점 및 리스크 분석 -->
                <div>
                    <h3 class="text-xl font-bold text-slate-900 border-l-4 border-rose-500 pl-3 mb-4">⚠️ 주요 단점 및 취약점 (Weakness)</h3>
                    <div id="result-weaknesses" class="grid grid-cols-1 gap-3">
                        <!-- 동적 주입 -->
                    </div>
                </div>

                <!-- 4) 전문가 제언: 추가 보완할 점 -->
                <div>
                    <h3 class="text-xl font-bold text-slate-900 border-l-4 border-amber-500 pl-3 mb-4">🎯 성장을 위한 추가 보완점 (Advice)</h3>
                    <div id="result-advices" class="bg-amber-50/60 p-5 rounded-2xl border border-amber-200 text-slate-700 leading-relaxed space-y-3">
                        <!-- 동적 주입 -->
                    </div>
                </div>

                <!-- 재시작 버튼 -->
                <div class="pt-4">
                    <button onclick="restartTest()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg text-center cursor-pointer">
                        테스트 초기화 및 다시 진단하기 🔄
                    </button>
                </div>
            </div>

        </div>
    </section>

    <!-- 내부 핵심 로직 -->
    <script>
        // 32개 정밀 문항 세트 (전면 유지)
        const questions = [
            { type: "EI", q: "주말에 에너지를 충전하는 최고의 방법은?", a: "친구들과 밖에서 시끌벅적 놀기", b: "이불 속에서 혼자 넷플릭스 보기" },
            { type: "EI", q: "처음 보는 사람들과 대화할 때 나의 행동은?", a: "어색함을 깨기 위해 먼저 말을 건다", b: "상대방이 말 걸어줄 때까지 기다린다" },
            { type: "EI", q: "팀 프로젝트를 할 때 선호하는 소통 방식은?", a: "직접 만나서 회의하거나 전화하기", b: "메신저나 이메일로 텍스트 소통하기" },
            { type: "EI", q: "단골 가게 사장님이 과하게 친근하게 말을 걸면?", a: "기분 좋게 스몰토크를 이어 나간다", b: "내적 내향인이 발동해 다음엔 다른 곳을 찾는다" },
            { type: "EI", q: "스트레스를 심하게 받았을 때 생각나는 것은?", a: "친구들과 술 한잔하며 털어버리기", b: "조용한 방에서 혼자만의 시간 갖기" },
            { type: "EI", q: "내 방을 꾸밀 때 더 신경 쓰이는 부분은?", a: "지인들을 초대했을 때 보여지는 거실/공간", b: "오직 나만의 아늑한 침대 주변" },
            { type: "EI", q: "파티나 모임에서 나는 주로 어떤 역할?", a: "대화를 주도하고 분위기를 띄우는 텐션 마스터", b: "리액션을 잘해주며 조용히 자리를 지키는 관객" },
            { type: "EI", q: "갑작스러운 친구의 '지금 나올래?' 제안에?", a: "기다렸다는 듯 옷을 입고 나간다", b: "이미 씻고 누웠으므로 절대 불가능하다" },
            { type: "NS", q: "새로 나온 음식을 먹을 때 나의 생각은?", a: "맛의 재료와 맛의 조화를 상상하고 분석한다", b: "그냥 맛있거나 맛없거나 직관적으로 판정한다" },
            { type: "NS", q: "비행기를 타고 먼 곳으로 여행을 갈 때?", a: "혹시 모를 추락 사고나 비상착륙 상황을 시뮬레이션한다", b: "가서 뭐 먹을지, 숙소는 어떨지 실용적인 생각을 한다" },
            { type: "NS", q: "친구가 '나 요즘 우주에 관심 생겼어' 라고 한다면?", a: "외계인의 존재나 지구 종말에 대해 토론을 시작한다", b: "우주 다큐멘터리 추천이나 관련 굿즈 이야기를 한다" },
            { type: "NS", q: "사과하면 가장 먼저 머릿속에 떠오르는 것은?", a: "스티브 잡스, 뉴턴, 독사과, 백설공주", b: "빨갛고 아삭하고 맛있는 과일 사과" },
            { type: "NS", q: "노래를 들을 때 내가 더 꽂히는 부분은?", a: "가사에 담긴 은유적인 의미와 분위기", b: "귀에 꽂히는 멜로디와 리듬" },
            { type: "NS", q: "아무 생각 없이 멍 때리라고 한다면?", a: "생각을 안 하려는 생각 때문에 온갖 상상이 꼬리를 문다", b: "진짜 머릿속을 하얗게 비우고 무념무상이 가능하다" },
            { type: "NS", q: "로또 1등에 당첨되는 상상을 할 때?", a: "건물을 사고 재단을 설립하는 구체적인 미래 계획까지 세운다", b: "일단 당첨되고 나서 생각하자며 금방 상상을 멈춘다" },
            { type: "NS", q: "사용 설명서를 읽을 때 나의 스타일은?", a: "대충 원리만 이해하면 설명서 없이 조립을 시작한다", b: "순서대로 1번부터 차근차근 정독하며 따라 한다" },
            { type: "TF", q: "친구가 '나 우울해서 화분 샀어' 라고 말할 때 나의 반응은?", a: "무슨 화분 샀어? 키우기 쉬운 거야?", b: "왜 우울해? 무슨 일 있었어? ㅠㅠ" },
            { type: "TF", q: "친구가 내 과실로 가벼운 교통사고를 냈다고 전화가 오면?", a: "보험은 불렀어? 다친 데는 없고?", b: "헐 어떡해! 진짜 놀랐겠다! 괜찮아?" },
            { type: "TF", q: "연인이 '나 시험 떨어졌어...' 라고 울먹일 때?", a: "몇 점 차이로 떨어졌어? 다음 시험 언제야?", b: "그동안 진짜 고생 많았는데 속상하겠다..." },
            { type: "TF", q: "영화나 드라마를 볼 때 나의 감정 상태는?", a: "스토리의 개연성과 완성도를 따지며 본다", b: "등장인물에 과몰입해서 폭풍 눈물을 흘린다" },
            { type: "TF", q: "내가 생각하는 진정한 위로란?", a: "문제를 해결할 수 있는 실질적인 대안 제시하기", b: "내 마음에 공감해 주고 곁에 있어 주기" },
            { type: "TF", q: "상대방의 피드백을 받을 때 더 편하게 느껴지는 어조는?", a: "조금 차갑더라도 명확하고 팩트 위주인 피드백", b: "나를 배려해서 부드럽고 완곡하게 돌려 말하는 피드백" },
            { type: "TF", q: "논쟁이나 말싸움이 생겼을 때 나의 태도는?", a: "누가 옳고 그른지 시시비비를 명확히 가려야 한다", b: "이유 불문하고 관계가 서먹해지거나 싸우는 상황 자체가 싫다" },
            { type: "TF", q: "친구가 헤어 스타일을 바꿨는데 내 눈에 별로일 때?", a: "솔직하게 이전 머리가 더 나은 것 같다고 말해준다", b: "상처받을까 봐 잘 어울린다고 영혼 없이 칭찬한다" },
            { type: "JP", q: "내일 친구들과 여행을 가기로 했다면 나의 상태는?", a: "시간 단위 일정표와 맛집 리스트가 완벽히 준비됨", b: "가서 꼴리는 대로 움직이기로 하고 짐만 대충 쌈" },
            { type: "JP", q: "과제를 하거나 업무를 처리할 때 나의 방식은?", a: "마감일보다 훨씬 먼저 계획을 세워 미리 끝낸다", b: "벼락치기의 스릴을 즐기며 마감 직전에 초인적인 힘을 낸다" },
            { type: "JP", q: "갑자기 약속이 취소되었을 때 나의 속마음은?", a: "내 계획이 틀어져서 살짝 스트레스 받거나 무얼 할지 방황한다", b: "오히려 좋아! 집에서 뒹굴거릴 생각에 행복하다" },
            { type: "JP", q: "내 책상 위나 방 안의 정리 상태는?", a: "물건들이 제자리에 완벽하게 정돈되어 있어야 마음이 편함", b: "필요한 게 어디 있는지 대충 내가 알 정도면 어질러져 있어도 무관" },
            { type: "JP", q: "카카오톡 지도에 저장된 맛집 리스트를 보면?", a: "지역별, 업종별로 깔끔하게 폴더 핑이 되어있다", b: "가고 싶은 곳들이 뒤죽박죽으로 무작위 저장되어 있다" },
            { type: "JP", q: "넷플릭스에서 볼 영상을 고를 때 나의 행동은?", a: "미리 찜해둔 검증된 리스트 중에서 순서대로 고른다", b: "이것저것 탐색 레이더를 돌리다가 고르는 데만 30분 걸린다" },
            { type: "JP", q: "약속 장소에 나갈 때 나의 시간 계산법은?", a: "이동 시간, 도보 시간, 변수까지 고려해 10분 전 도착 타겟팅", b: "출발할 때 시계를 보고 대충 아슬아슬하게 도착하거나 약간 늦음" },
            { type: "JP", q: "새해 목표나 버킷리스트를 작성할 때?", a: "달성 기간과 세부 행동 수칙까지 적어둔다", b: "큼직하고 낭만적인 목표만 적어두고 일단 다짐에 만족한다" }
        ];

        // 16개 MBTI 전문 해설 확장 딕셔너리 데이터베이스
        const professionalMbtiDB = {
            ISTJ: {
                emoji: "🗿", title: "청렴결백한 논리주의자",
                features: ["한번 시작한 일은 끝까지 책임지는 현실주의자입니다.", "질서와 규칙을 숭배하며 매사에 철저하고 조직적입니다.", "자신이 맡은 직무나 조직에 대한 충성심이 대단히 강합니다."],
                strengths: ["매우 정확하고 꼼꼼하게 업무를 완수하는 신뢰성", "과거 경험과 객관적 데이터를 활용한 현실적 문제 해결 능력", "위기 상황 속에서도 흔들리지 않는 평정심과 냉철함"],
                weaknesses: ["기존 규칙에서 벗어난 새로운 변화나 혁신에 대한 거부감", "자신의 가치관과 다르면 타인을 다소 쉽게 판단하는 경향", "직설적이고 팩트 중심의 소통으로 타인에게 상처를 줌"],
